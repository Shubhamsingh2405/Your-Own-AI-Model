services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SQLITE_PATH=/app/data/vectordb.sqlite
    volumes:
      - app-data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  app-data:
  ollama-data:
